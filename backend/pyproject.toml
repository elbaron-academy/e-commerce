[project]
name = "rocket-backend"
version = "1.0.0"
description = "Rocket Market API (Django REST Framework)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # Arabic text is intentional
  "RUF012",                      # Django/DRF class attributes
  "S105", "S106",                # "password"/"token" field names are not secrets
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311"]
"config/settings/*" = ["F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --reuse-db -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore:No directory at:UserWarning"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/management/commands/seed_demo.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true
