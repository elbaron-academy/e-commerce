# API: https://api.rocket.hossam-ameen.online → gunicorn on 127.0.0.1:8077 (port 8000 is used by another app on the VM)
# Static (Django admin) and uploaded media are served by nginx from /opt/rocket.

upstream rocket_api {
    server 127.0.0.1:8077;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.rocket.hossam-ameen.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.rocket.hossam-ameen.online;

    ssl_certificate     /etc/letsencrypt/live/api.rocket.hossam-ameen.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rocket.hossam-ameen.online/privkey.pem;
    include /etc/nginx/snippets/rocket-ssl.conf;

    client_max_body_size 10m;  # product photo uploads

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    location /static/ {
        alias /opt/rocket/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /opt/rocket/media/;
        expires 7d;
        access_log off;
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        proxy_pass http://rocket_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
