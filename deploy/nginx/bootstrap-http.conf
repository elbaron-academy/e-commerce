# Temporary HTTP-only config used until the TLS certificates exist.
# server-setup.sh replaces __WEB_DOMAIN__ / __API_DOMAIN__.
server {
    listen 80;
    listen [::]:80;
    server_name __WEB_DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;
    client_max_body_size 10m;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /static/ { alias /opt/rocket/static/; }
    location /media/ { alias /opt/rocket/media/; }
    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
