# Storefront: https://rocket.hossam-ameen.online → Nuxt server on 127.0.0.1:3000
# Release files: /var/www/html/rocket/current (symlink to the active release)

upstream rocket_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name rocket.hossam-ameen.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rocket.hossam-ameen.online;

    ssl_certificate     /etc/letsencrypt/live/rocket.hossam-ameen.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rocket.hossam-ameen.online/privkey.pem;
    include /etc/nginx/snippets/rocket-ssl.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Hashed build files never change: cache them for a year.
    location /_nuxt/ {
        alias /var/www/html/rocket/current/public/_nuxt/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The service worker and manifest must always be fresh, or updates never arrive.
    location ~ ^/(sw\.js|manifest\.webmanifest)$ {
        root /var/www/html/rocket/current/public;
        add_header Cache-Control "no-cache";
        types { application/javascript js; application/manifest+json webmanifest; }
    }

    location / {
        proxy_pass http://rocket_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
