<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E7C5A">
  <title>روكت ماركت · أوفلاين</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      font-family: "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif; background: #F5F6F4; color: #15211C; text-align: center; }
    main { max-width: 360px; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 22px; margin: 20px 0 6px; }
    p { margin: 0; color: #5F6D67; font-size: 15px; line-height: 1.6; }
    .en { direction: ltr; margin-top: 18px; padding-top: 18px; border-top: 1px solid #E3E8E5; }
    .en h2 { font-size: 16px; margin: 0 0 4px; color: #15211C; }
    button { margin-top: 24px; height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: #0E7C5A; color: #fff;
      font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.svg" alt="">
    <h1>أنت أوفلاين دلوقتي</h1>
    <p>الصفحة دي مش محفوظة على جهازك. اتأكد من النت وجرب تاني، والسلة بتاعتك محفوظة زي ما هي.</p>
    <div class="en">
      <h2>You're offline</h2>
      <p>This page isn't saved on your device yet. Check your connection and try again. Your cart is safe.</p>
    </div>
    <button type="button" onclick="location.reload()">حاول تاني · Try again</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload() })</script>
</body>
</html>
