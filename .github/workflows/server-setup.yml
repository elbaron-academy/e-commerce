name: Server setup

# Run once from the Actions tab (and again any time to repair or renew the setup).
# Installs nginx, Python, Node.js and certbot on the VM, creates /opt/rocket and
# /var/www/html/rocket, secrets, systemd services and HTTPS certificates.

on:
  workflow_dispatch:
    inputs:
      certbot_email:
        description: Email for Let's Encrypt expiry notices (optional)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ vars.DEPLOY_HOST || '35.226.179.10' }}
          user: ${{ vars.DEPLOY_USER || 'hossam' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Copy deploy files
        run: |
          ssh rocket 'rm -rf /tmp/rocket-setup'
          scp -rq deploy rocket:/tmp/rocket-setup
      - name: Run setup (needs passwordless sudo for the deploy user)
        env:
          CERTBOT_EMAIL: ${{ inputs.certbot_email }}
        run: ssh rocket "sudo -n DEPLOY_USER=\$(whoami) CERTBOT_EMAIL='$CERTBOT_EMAIL' bash /tmp/rocket-setup/scripts/server-setup.sh"
