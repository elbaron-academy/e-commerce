name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '35.226.179.10' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'hossam' }}
  WEB_URL: https://rocket.hossam-ameen.online
  API_URL: https://api.rocket.hossam-ameen.online

jobs:
  backend:
    name: Backend · lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Tests (coverage ≥ 70%)
        run: pytest --cov --cov-report=term --cov-fail-under=70
      - name: Production settings check
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ENV_FILE: /nonexistent
          SECRET_KEY: ci-only-${{ github.sha }}-not-a-real-secret
          ALLOWED_HOSTS: api.rocket.hossam-ameen.online

  storefront:
    name: Storefront · typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci
      - run: npx nuxt typecheck
      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_SITE_URL: ${{ env.WEB_URL }}
      - name: Package
        run: tar -czf ../storefront-build.tgz -C .output .
      - uses: actions/upload-artifact@v4
        with:
          name: storefront-build
          path: storefront-build.tgz
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: [backend, storefront]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.WEB_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: storefront-build
      - name: Package backend
        run: git archive --format=tar.gz -o backend.tgz HEAD backend deploy
      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ env.DEPLOY_HOST }}
          user: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Upload release
        run: |
          RELEASE="${GITHUB_SHA::12}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          ssh rocket 'test -d /opt/rocket/incoming' || {
            echo "::error::The server isn't set up yet. Run the 'Server setup' workflow once (see deploy/README.md)."
            exit 1
          }
          scp -q backend.tgz "rocket:/opt/rocket/incoming/backend-$RELEASE.tgz"
          scp -q storefront-build.tgz "rocket:/opt/rocket/incoming/storefront-$RELEASE.tgz"
      - name: Deploy backend
        run: ssh rocket "bash -s -- $RELEASE" < deploy/scripts/deploy-backend.sh
      - name: Deploy storefront
        run: ssh rocket "bash -s -- $RELEASE" < deploy/scripts/deploy-storefront.sh
      - name: Smoke test over HTTPS
        continue-on-error: true  # passes once DNS and certificates are in place
        run: |
          curl -fsS --retry 5 --retry-delay 3 "$API_URL/api/health/"
          curl -fsS -o /dev/null --retry 5 --retry-delay 3 "$WEB_URL/" && echo "storefront OK"
