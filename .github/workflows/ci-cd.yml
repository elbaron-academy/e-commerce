name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '35.226.179.10' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'hossam' }}
  WEB_URL: https://rocket.hossam-ameen.online
  API_URL: https://api.rocket.hossam-ameen.online

jobs:
  backend:
    name: Backend · lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Tests (coverage ≥ 70%)
        run: pytest --cov --cov-report=term --cov-fail-under=70
      - name: Production settings check
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ENV_FILE: /nonexistent
          SECRET_KEY: ci-only-${{ github.sha }}-not-a-real-secret
          ALLOWED_HOSTS: api.rocket.hossam-ameen.online

  storefront:
    name: Storefront · typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci
      - run: npx nuxt typecheck
      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_SITE_URL: ${{ env.WEB_URL }}
      - name: Package
        run: tar -czf ../storefront-build.tgz -C .output .
      - uses: actions/upload-artifact@v4
        with:
          name: storefront-build
          path: storefront-build.tgz
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: [backend, storefront]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.WEB_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: storefront-build
      - name: Package backend
        run: |
          git archive --format=tar.gz -o backend.tgz HEAD backend deploy
          echo "RELEASE=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - id: ssh
        uses: ./.github/actions/ssh-setup
        with:
          host: ${{ env.DEPLOY_HOST }}
          user: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Set up the server (first deploy, or until HTTPS certificates exist)
        run: |
          check='test -d /opt/rocket/incoming && test -x /opt/rocket/venv/bin/python'
          for d in rocket.hossam-ameen.online api.rocket.hossam-ameen.online; do
            check="$check && sudo -n test -f /etc/letsencrypt/live/$d/fullchain.pem"
          done
          if ssh rocket "$check" 2>/dev/null; then
            echo "Server is set up."
          else
            ssh rocket 'rm -rf /tmp/rocket-setup' && scp -rq deploy rocket:/tmp/rocket-setup
            .github/scripts/run.sh "Server setup" ssh rocket 'sudo -n DEPLOY_USER=$(whoami) bash /tmp/rocket-setup/scripts/server-setup.sh'
          fi
      - name: Upload release
        run: |
          scp -q backend.tgz "rocket:/opt/rocket/incoming/backend-$RELEASE.tgz"
          scp -q storefront-build.tgz "rocket:/opt/rocket/incoming/storefront-$RELEASE.tgz"
      - name: Deploy backend
        run: .github/scripts/run.sh "Deploy backend" bash -c 'ssh rocket "bash -s -- $RELEASE" < deploy/scripts/deploy-backend.sh'
      - name: Deploy storefront
        run: .github/scripts/run.sh "Deploy storefront" bash -c 'ssh rocket "bash -s -- $RELEASE" < deploy/scripts/deploy-storefront.sh'
      - name: Server report
        if: always() && steps.ssh.outcome == 'success'
        run: |
          encode() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          resolve() { (dig +short A "$1" @1.1.1.1 2>/dev/null || getent ahostsv4 "$1" | awk '{print $1}') | sort -u | tr '\n' ' '; }
          web_ip="$(resolve rocket.hossam-ameen.online)"
          api_ip="$(resolve api.rocket.hossam-ameen.online)"
          dns_ok=$([ "${web_ip% }" = "$DEPLOY_HOST" ] && [ "${api_ip% }" = "$DEPLOY_HOST" ] && echo "✓ both point to the VM" || echo "✗ expected $DEPLOY_HOST")
          echo "::notice title=DNS::rocket.hossam-ameen.online → ${web_ip:-no record} · api.rocket.hossam-ameen.online → ${api_ip:-no record} · $dns_ok"
          web="$(curl -s -o /dev/null -w '%{http_code}' -m 15 "$WEB_URL/" || true)"
          api="$(curl -s -m 15 "$API_URL/api/health/" || true)"
          http_api="$(curl -s -o /dev/null -w '%{http_code}' -m 15 "http://api.rocket.hossam-ameen.online/api/health/" || true)"
          echo "::notice title=Public URLs::$WEB_URL → HTTP ${web:-000} · $API_URL/api/health/ → ${api:-no answer} · plain HTTP API → ${http_api:-000}"
          report="$(ssh rocket 'bash -s' < .github/scripts/server-report.sh 2>&1 || true)"
          printf '%s\n' "$report"
          echo "::notice title=Server::$(printf '%s\n' "$report" | encode)"
